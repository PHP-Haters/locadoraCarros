name: CI/CD Pipeline - Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # -------------------------------------------------------------
      # 1. ETAPA DE TESTES (Abortará o deploy caso algum teste falhe)
      # -------------------------------------------------------------
      - name: Executar Testes Automatizados
        run: mvn test

      # -------------------------------------------------------------
      # 2. AUTENTICAÇÃO NO GOOGLE CLOUD
      # -------------------------------------------------------------
      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # -------------------------------------------------------------
      # 3. DEPLOY AUTOMÁTICO NO GOOGLE CLOUD RUN
      # -------------------------------------------------------------
      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy backend-aluguel-carros \
            --source . \
            --region us-central1 \
            --memory 1Gi \
            --allow-unauthenticated \
            --set-env-vars="SPRING_DATASOURCE_URL=jdbc:mysql://35.254.139.121:3306/aluguel_carros?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC,SPRING_DATASOURCE_USERNAME=admin,SPRING_DATASOURCE_PASSWORD=uniroot"